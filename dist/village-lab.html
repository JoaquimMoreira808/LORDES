<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORDES · Teste de vila</title><link rel="stylesheet" href="design-system.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}a{color:var(--action)}h1{font-size:24px}figcaption{font-size:16px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin:24px 0}label{display:grid;gap:8px;font-size:13px}input,select,button{padding:8px;background:var(--stone);color:var(--ink);border:1px solid var(--line);border-radius:8px}input[type=number]{width:100px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{margin-bottom:10px}.viewport{height:65vh;min-height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#121811}.viewport canvas{display:block;width:100%;height:100%}#status{font-size:13px;color:var(--muted)}@media(max-width:800px){.views{grid-template-columns:1fr}.viewport{height:50vh}}

<a href="./">← Voltar ao jogo</a><p><a href="house-lab.html">Abrir teste mínimo de uma casa e diagnóstico de caracteres →</a></p><h1>Vila · Geradores + ASCII Arrow</h1>
<form id="settings" class="controls"><label>Gerador<select id="generator"><option value="cheoma">Cheoma</option><option value="threejs-city" selected>threejs-city</option></select></label><label>Seed<input id="seed" type="number" value="7" min="1" max="999999" required></label><label>Escala<select id="scale"><option value="hamlet">Povoado</option><option value="village">Vila</option></select></label><button type="submit">Gerar vila</button><label>Caracteres<select id="gradient"><option value="arrow">Arrow</option><option value="extended">Extended</option></select></label><label>Colunas <output id="columns-value">160</output><input id="columns" type="range" min="60" max="280" step="10" value="160"></label><label>Brilho <output id="brightness-value">100%</output><input id="brightness" type="range" min="40" max="180" value="100"></label><label>Contraste <output id="contrast-value">160%</output><input id="contrast" type="range" min="50" max="250" value="160"></label><label>Cores<select id="color-mode"><option value="image">Cores da imagem</option><option value="people">Somente moradores</option><option value="mono">Monocromático</option></select></label><label>Saturação <output id="saturation-value">140%</output><input id="saturation" type="range" min="0" max="200" value="140"></label><label>Luminosidade das cores <output id="color-light-value">150%</output><input id="color-light" type="range" min="100" max="250" value="150"></label><label><span>Movimento</span><input id="animate" type="checkbox" checked aria-label="Animar moradores"></label></form>
<p id="status" role="status">Carregando bibliotecas locais…</p>
<div class="views"><figure><figcaption>Vila 3D · arraste para girar, use a roda para aproximar</figcaption><div class="viewport" id="original"></div></figure><figure><figcaption>Vila em ASCII · Arrow</figcaption><div class="viewport" id="ascii"><canvas id="ascii-canvas" aria-label="Vila convertida para caracteres ASCII"></canvas></div></figure></div>
<script type="module">import('./game/village-lab.mjs?v=vendor-trim-15').catch(error=>{document.getElementById('status').textContent='Não foi possível iniciar o teste: '+error.message;console.error(error);});</script></body></html>
