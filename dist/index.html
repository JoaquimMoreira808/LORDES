<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LORDES · Seu povo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif&family=Bitcount+Prop+Single:wght@100..900&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=loot-2"><link rel="stylesheet" href="design-system.css?v=runtime-icons-1"></head>
<body data-session="login">
<section class="login-screen" id="login-screen" aria-label="Entrar em LORDES"><form class="login-panel" id="login-form"><span class="login-rune rune-glyph" aria-hidden="true">ᛟ</span><a class="brand login-brand" href="./">LORDES</a><label for="player-name">SEU NOME</label><input id="player-name" name="name" autocomplete="username" minlength="1" maxlength="40" required ><button class="login-submit" id="login-submit" type="submit">Entrar na aldeia <span aria-hidden="true">→</span></button><p class="login-error" id="login-error" role="alert"></p></form></section>
<div id="game-shell" inert hidden><header><a class="brand" href="./">LORDES</a><div class="player-controls"><span id="player-label"></span><span class="save-status" id="save-status" role="status" aria-live="polite"></span><button id="save-button" type="button">Salvar</button><button id="logout-button" type="button">Sair</button></div></header>
<main>
<aside class="resource-sidebar" aria-labelledby="resource-title"><div class="sidebar-heading"><span class="sidebar-mark" aria-hidden="true">◈</span><h2 id="resource-title">Seus recursos</h2><button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="resource-search resources" aria-label="Recolher recursos" title="Recolher recursos"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="1.5"/></svg></button></div><input id="resource-search" class="resource-search" type="search" placeholder="Pesquisar recursos…" aria-label="Pesquisar seus recursos" aria-controls="resources" autocomplete="off"><div id="resources" class="resource-list"></div><small class="icon-attribution">Ícones: <a href="https://game-icons.net/" target="_blank" rel="noopener noreferrer">Lorc, Delapouite e colaboradores</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer">CC BY 3.0</a> · adaptados para pixel art</small></aside>
<section id="shelves" class="shelves" aria-label="Estantes de trabalho"></section>
</main>
<aside class="population-drawer" id="population-drawer" aria-label="Decks e ações">
<button class="drawer-handle sidebar-toggle" id="drawer-toggle" aria-expanded="false" aria-controls="drawer-content" aria-label="Abrir decks e ações" title="Abrir decks e ações"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="1.5"/></svg></button>
<div class="return-zone" id="return-zone" aria-label="Devolver cidadãos aos seus bundles" inert><span class="return-rune rune-glyph" aria-hidden="true">ᛟ</span><div><h2>Devolver</h2><p id="return-description">Solte as cartas aqui para voltarem aos seus bundles</p></div><span class="return-arrow" aria-hidden="true">↓</span></div>
<div class="drawer-content" id="drawer-content" inert>
<div class="drawer-heading sidebar-heading"><h2>Seus decks</h2></div>
<div class="drawer-tabs" role="tablist" aria-label="Decks e ações"><button id="actions-tab" role="tab" aria-selected="false" aria-controls="actions-panel" tabindex="-1">Ações</button><button id="decks-tab" role="tab" aria-selected="true" aria-controls="decks-panel">Decks</button></div>
<div id="actions-panel" role="tabpanel" aria-labelledby="actions-tab" tabindex="0" hidden></div>
<div id="decks-panel" role="tabpanel" aria-labelledby="decks-tab"><span id="deck-count" class="deck-count"></span>
<div class="deck-list" id="deck-list"></div><p class="assignment-status" id="assignment-status" role="status" aria-live="polite"></p>
</div></div></aside>
</div>
<script type="module" src="app.js?v=runtime-icons-1"></script></body></html>
